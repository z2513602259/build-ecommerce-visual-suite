name: Skill tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python3 scripts/test_validate_output.py
      - name: Run v3 workflow tests
        run: python3 scripts/test_v3_workflow.py
